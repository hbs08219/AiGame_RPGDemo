<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>称号系统编辑器</title>
<script type="application/json" id="agmaker-editor-contract">
{
  "version": 1,
  "pluginId": "project.title",
  "dataAccess": {
    "mechanism": "plugin-action-api",
    "capabilities": ["toolgen.read", "toolgen.write"],
    "available": true
  },
  "crud": {
    "read": { "available": true, "operation": "list", "method": "POST", "actionName": "project.title.list_titles", "path": "/plugin-tool/project.title/project.title.list_titles" },
    "create": { "available": true, "operation": "create", "method": "POST", "actionName": "project.title.create_title", "path": "/plugin-tool/project.title/project.title.create_title" },
    "update": { "available": true, "operation": "update", "method": "POST", "actionName": "project.title.update_title", "path": "/plugin-tool/project.title/project.title.update_title" },
    "delete": { "available": true, "operation": "delete", "method": "POST", "actionName": "project.title.delete_title", "path": "/plugin-tool/project.title/project.title.delete_title" }
  },
  "coreResourceId": "title",
  "resources": [
    {
      "id": "title",
      "displayName": "称号",
      "operations": { "create": true, "delete": true, "findReferences": false, "get": true, "list": true, "update": true, "validate": true },
      "actions": {
        "read": { "available": true, "operation": "list", "method": "POST", "actionName": "project.title.list_titles", "path": "/plugin-tool/project.title/project.title.list_titles" },
        "create": { "available": true, "operation": "create", "method": "POST", "actionName": "project.title.create_title", "path": "/plugin-tool/project.title/project.title.create_title" },
        "update": { "available": true, "operation": "update", "method": "POST", "actionName": "project.title.update_title", "path": "/plugin-tool/project.title/project.title.update_title" },
        "delete": { "available": true, "operation": "delete", "method": "POST", "actionName": "project.title.delete_title", "path": "/plugin-tool/project.title/project.title.delete_title" }
      }
    }
  ]
}
</script>
<style>
  :root {
    --bg-0: #14161a; --bg-1: #1b1e24; --bg-2: #232730; --bg-3: #2b303a;
    --border: #383e4a; --text-0: #e8eaee; --text-1: #c3c9d3; --text-2: #9aa3b2;
    --accent: #5b9dff; --accent-text: #0b1420; --danger: #ff6b6b; --danger-bg: #3a2020;
    --success: #4fd18b; --focus-ring: #5b9dff; --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--text-0);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
  #app { display: flex; flex-direction: column; min-width: 1024px; height: 100vh; }
  header.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
    background: var(--bg-1); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  header.topbar h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--text-0); }
  header.topbar .sub { color: var(--text-2); font-size: 12px; margin-left: 8px; }
  #global-banner { flex: 0 0 auto; padding: 8px 16px; font-size: 13px; display: none; border-bottom: 1px solid var(--border); }
  #global-banner.show { display: block; }
  #global-banner.error { background: var(--danger-bg); color: #ffb3b3; }
  #global-banner.info { background: #1f3a4d; color: #bfe3ff; }
  main[data-layout="list-detail"] { flex: 1 1 auto; display: flex; min-height: 0; }
  nav.list-pane { width: 320px; min-width: 280px; flex: 0 0 auto; border-right: 1px solid var(--border);
    background: var(--bg-1); display: flex; flex-direction: column; min-height: 0; }
  .list-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .list-header .row-top { display: flex; align-items: center; justify-content: space-between; }
  .list-header h2 { font-size: 13px; color: var(--text-1); margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  input.search-box { width: 100%; padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-2); color: var(--text-0); }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, li:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .btn { border: 1px solid var(--border); background: var(--bg-2); color: var(--text-0); padding: 6px 12px; border-radius: var(--radius); font-size: 13px; }
  .btn:hover:not(:disabled) { background: var(--bg-3); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger { background: transparent; color: var(--danger); border-color: #6a3232; }
  .btn.danger:hover:not(:disabled) { background: var(--danger-bg); }
  .btn.block { width: 100%; }
  ul.title-list { list-style: none; margin: 0; padding: 4px; overflow-y: auto; flex: 1 1 auto; }
  ul.title-list li { padding: 9px 10px; border-radius: var(--radius); cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; display: flex; flex-direction: column; gap: 2px; }
  ul.title-list li:hover { background: var(--bg-2); }
  ul.title-list li[aria-selected="true"] { background: var(--bg-3); border-color: var(--accent); }
  ul.title-list li .row1 { display: flex; align-items: baseline; gap: 6px; }
  ul.title-list li .selected-marker { color: var(--accent); font-weight: 700; width: 14px; display: inline-block; }
  ul.title-list li .name { font-size: 13.5px; color: var(--text-0); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.title-list li[aria-selected="true"] .name { font-weight: 700; }
  ul.title-list li .name.empty-name { color: var(--text-2); font-style: italic; }
  ul.title-list li .id { font-size: 11px; color: var(--text-2); font-family: Consolas, monospace; }
  .list-status { padding: 24px 16px; color: var(--text-2); font-size: 13px; text-align: center; }
  .list-status .icon { font-size: 22px; display: block; margin-bottom: 8px; }
  .list-status .retry { margin-top: 10px; }
  section.detail-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg-0); }
  .detail-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .detail-header .title-block h2 { margin: 0; font-size: 16px; color: var(--text-0); }
  .detail-header .title-block .status-line { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .detail-header .status-line .dirty-flag { color: #ffb454; font-weight: 600; }
  .detail-header .status-line .saved-flag { color: var(--success); }
  .detail-header .actions { display: flex; gap: 8px; }
  .detail-body { flex: 1 1 auto; overflow-y: auto; padding: 20px; }
  form[data-editor-form] { max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; color: var(--text-1); font-weight: 600; }
  .field .help { font-size: 12px; color: var(--text-2); }
  .field input[type="text"], .field textarea { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-0); padding: 8px 10px; font-size: 13.5px; font-family: inherit; }
  .field input[readonly] { color: var(--text-2); background: var(--bg-1); }
  .field textarea { min-height: 96px; resize: vertical; }
  .field.has-error input, .field.has-error textarea { border-color: var(--danger); }
  .field-error { font-size: 12px; color: var(--danger); }
  .field-error:empty { display: none; }
  .empty-state, .no-selection-state, .error-state, .loading-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-2); text-align: center; padding: 40px; }
  .empty-state .icon, .no-selection-state .icon, .error-state .icon, .loading-state .icon { font-size: 30px; }
  .error-state { color: #ffb3b3; }
  .no-selection-hint { max-width: 640px; margin: 0 0 16px 0; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-2); font-size: 13px; background: var(--bg-1); }
  [hidden] { display: none !important; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; width: 420px; max-width: 90vw; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .modal-box h3 { margin: 0 0 8px 0; font-size: 15px; color: var(--text-0); }
  .modal-box p { margin: 0 0 16px 0; font-size: 13px; color: var(--text-1); line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div><h1>称号系统编辑器<span class="sub">称号名称与描述配置</span></h1></div>
    <div class="actions">
      <button type="button" class="btn" id="btn-refresh" data-crud-operation="read" title="重新加载列表">刷新列表</button>
    </div>
  </header>

  <div id="global-banner" role="alert" aria-live="polite"></div>

  <main data-layout="list-detail" data-resource-id="title">
    <nav class="list-pane" aria-label="称号列表">
      <div class="list-header" data-placement="list-header">
        <div class="row-top"><h2 id="list-heading">称号列表</h2></div>
        <button type="button" class="btn primary block" id="btn-new" data-crud-operation="create" data-placement="list-header">+ 新建称号</button>
        <input type="search" class="search-box" id="search-box" placeholder="按称号名 / ID 搜索" aria-label="搜索称号" />
      </div>
      <div id="list-loading" class="list-status" hidden><span class="icon" aria-hidden="true">⏳</span>列表加载中…</div>
      <div id="list-error" class="list-status" hidden>
        <span class="icon" aria-hidden="true">⚠</span>
        <div id="list-error-text">加载称号列表失败</div>
        <button type="button" class="btn retry" id="btn-list-retry" data-crud-operation="read">重试</button>
      </div>
      <div id="list-empty" class="list-status" hidden><span class="icon" aria-hidden="true">🏷</span>暂无称号，点击“新建称号”创建第一个</div>
      <ul class="title-list" id="title-list" role="listbox" aria-labelledby="list-heading" hidden></ul>
    </nav>
    <section class="detail-pane" id="detail-pane" aria-live="polite"></section>
  </main>
</div>
<div id="modal-root"></div>

<script>
(function () {
  "use strict";

  var CONTRACT = JSON.parse(document.getElementById('agmaker-editor-contract').textContent);
  var ACTIONS = CONTRACT.crud;
  var projectId = new URLSearchParams(window.location.search).get('projectId') || '';
  var authToken = '';
  var authReady = false;

  function headers(interactiveApproval) {
    var result = {
      'Content-Type': 'application/json',
      'X-Aigame-Project-Context': 'iframe',
      'X-Aigame-Project-Id': projectId,
      Authorization: `Bearer ${authToken}`
    };
    // 一次性审批令牌只存在于调用栈中，只附加到对应的 delete 请求。
    if (interactiveApproval) result['X-Harness-Interactive-Approval'] = interactiveApproval;
    return result;
  }

  function readActionResponse(res) {
    return res.text().then(function (text) {
      var json = null;
      try { json = text ? JSON.parse(text) : {}; } catch (e) { json = { raw: text }; }
      if (!res.ok || json.ok === false || json.error) {
        var msg = (json && (json.error || json.message)) || ('请求失败（HTTP ' + res.status + '）');
        var err = new Error(msg);
        err.status = res.status;
        err.code = json && (json.code || json.error);
        err.payload = json;
        throw err;
      }
      return json;
    });
  }

  function normalizeItem(item) {
    if (!item || typeof item !== 'object') return null;
    var document = item.document && typeof item.document === 'object' ? item.document : item;
    var normalized = Object.assign({}, document);
    if (item.id) normalized.id = item.id;
    if (item.revision) normalized.revision = item.revision;
    if (item.etag) normalized.etag = item.etag;
    return normalized.id ? normalized : null;
  }

  function extractList(json) {
    var data = json && json.data ? json.data : json;
    var result = data && data.result && typeof data.result === 'object' ? data.result : data;
    var items = Array.isArray(result) ? result : result && (result.items || result.list);
    return Array.isArray(items) ? items.map(normalizeItem).filter(Boolean) : [];
  }
  function extractItem(json, fallback) {
    var data = json && json.data ? json.data : json;
    var result = data && data.result && typeof data.result === 'object' ? data.result : data;
    var normalized = normalizeItem(result && (result.item || result));
    return normalized ? Object.assign({}, fallback || {}, normalized) : (fallback || null);
  }

  function listTitles() {
    return fetch(`/plugin-tool/project.title/project.title.list_titles?projectId=${encodeURIComponent(projectId)}`, {
      method: 'POST', credentials: 'include', headers: headers(), body: JSON.stringify({ limit: 200 })
    }).then(readActionResponse).then(extractList);
  }
  function createTitle(record) {
    return fetch(`/plugin-tool/project.title/project.title.create_title?projectId=${encodeURIComponent(projectId)}`, {
      method: 'POST', credentials: 'include', headers: headers(), body: JSON.stringify({ document: record })
    }).then(readActionResponse).then(function (json) { return extractItem(json, record); });
  }
  function updateTitle(record, revision) {
    return fetch(`/plugin-tool/project.title/project.title.update_title?projectId=${encodeURIComponent(projectId)}`, {
      method: 'POST', credentials: 'include', headers: headers(), body: JSON.stringify({ id: record.id, patch: { name: record.name, description: record.description }, revision: revision })
    }).then(readActionResponse).then(function (json) { return extractItem(json, record); });
  }
  function deleteTitle(id, revision, interactiveApproval) {
    return fetch(`/plugin-tool/project.title/project.title.delete_title?projectId=${encodeURIComponent(projectId)}`, {
      method: 'POST', credentials: 'include', headers: headers(interactiveApproval), body: JSON.stringify({ id: id, revision: revision })
    }).then(readActionResponse);
  }

  var state = {
    items: [], listStatus: 'loading', listErrorMessage: '', searchTerm: '',
    selectedId: null, revision: null,
    form: { id: '', name: '', description: '' },
    originalSnapshot: null, dirty: false,
    saveState: 'idle', saveErrorMessage: '', nameError: '', pendingAction: null
  };

  function genTitleId() { return 'TT_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
  function cloneForm(f) { return { id: f.id, name: f.name, description: f.description }; }
  function computeDirty() {
    if (!state.originalSnapshot) return false;
    return state.form.name !== state.originalSnapshot.name || state.form.description !== state.originalSnapshot.description;
  }

  var elBanner = document.getElementById('global-banner');
  var elListLoading = document.getElementById('list-loading');
  var elListError = document.getElementById('list-error');
  var elListErrorText = document.getElementById('list-error-text');
  var elListEmpty = document.getElementById('list-empty');
  var elList = document.getElementById('title-list');
  var elDetailPane = document.getElementById('detail-pane');
  var elSearch = document.getElementById('search-box');
  var elModalRoot = document.getElementById('modal-root');

  function showBanner(kind, message) { elBanner.className = 'show ' + kind; elBanner.textContent = message; }
  function hideBanner() { elBanner.className = ''; elBanner.textContent = ''; }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function filteredItems() {
    var term = state.searchTerm.trim().toLowerCase();
    if (!term) return state.items;
    return state.items.filter(function (it) {
      var name = (it.name || '').toLowerCase();
      var id = (it.id || '').toLowerCase();
      return name.indexOf(term) !== -1 || id.indexOf(term) !== -1;
    });
  }

  function renderList() {
    elListLoading.hidden = state.listStatus !== 'loading';
    elListError.hidden = state.listStatus !== 'error';
    if (state.listStatus === 'error') elListErrorText.textContent = state.listErrorMessage || '加载称号列表失败';

    var showEmpty = state.listStatus === 'loaded' && state.items.length === 0;
    elListEmpty.hidden = !showEmpty;

    if (state.listStatus !== 'loaded' || state.items.length === 0) {
      elList.hidden = true; elList.innerHTML = ''; return;
    }
    elList.hidden = false; elList.innerHTML = '';
    var items = filteredItems();
    if (items.length === 0) {
      var noMatch = document.createElement('div');
      noMatch.className = 'list-status';
      noMatch.textContent = '没有匹配“' + state.searchTerm + '”的称号';
      elList.appendChild(noMatch);
      return;
    }
    items.forEach(function (it) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option'); li.setAttribute('tabindex', '0');
      var selected = it.id === state.selectedId;
      li.setAttribute('aria-selected', selected ? 'true' : 'false');
      var row1 = document.createElement('div'); row1.className = 'row1';
      var marker = document.createElement('span'); marker.className = 'selected-marker'; marker.setAttribute('aria-hidden', 'true');
      marker.textContent = selected ? '▶' : '';
      var name = document.createElement('span'); name.className = 'name' + (it.name ? '' : ' empty-name');
      name.textContent = it.name ? it.name : '（未命名）';
      row1.appendChild(marker); row1.appendChild(name);
      var idLine = document.createElement('div'); idLine.className = 'id'; idLine.textContent = it.id;
      li.appendChild(row1); li.appendChild(idLine);
      li.addEventListener('click', function () { requestSelect(it.id); });
      li.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); requestSelect(it.id); }
      });
      elList.appendChild(li);
    });
  }

  function renderDetail() {
    elDetailPane.innerHTML = '';

    if (state.listStatus === 'loading' && !state.selectedId) {
      var loading = document.createElement('div'); loading.className = 'loading-state';
      loading.innerHTML = '<span class="icon" aria-hidden="true">⏳</span><div>加载中…</div>';
      elDetailPane.appendChild(loading); return;
    }
    if (state.listStatus === 'error' && !state.selectedId) {
      var err = document.createElement('div'); err.className = 'error-state';
      err.innerHTML = '<span class="icon" aria-hidden="true">⚠</span><div>' + escapeHtml(state.listErrorMessage || '加载失败') + '</div>';
      var retry = document.createElement('button'); retry.type = 'button'; retry.className = 'btn'; retry.textContent = '重试';
      retry.setAttribute('data-crud-operation', 'read');
      retry.addEventListener('click', function () { loadList(); });
      err.appendChild(retry);
      elDetailPane.appendChild(err); return;
    }
    var hasSelection = !!state.selectedId;

    var header = document.createElement('div'); header.className = 'detail-header';
    var titleBlock = document.createElement('div'); titleBlock.className = 'title-block';
    var h2 = document.createElement('h2'); h2.id = 'detail-heading';
    h2.textContent = hasSelection ? (state.form.name || '（未命名）') : '称号详情';
    var statusLine = document.createElement('div'); statusLine.id = 'detail-status-line'; statusLine.className = 'status-line';
    titleBlock.appendChild(h2); titleBlock.appendChild(statusLine);

    var actions = document.createElement('div'); actions.className = 'actions';
    actions.innerHTML =
      '<button type="button" class="btn danger" id="btn-delete" data-crud-operation="delete"' +
      (hasSelection && !deleteInProgress ? ' title="删除当前称号（需审批确认）"' : ' disabled title="' + (deleteInProgress ? '正在等待删除审批' : '请先在列表中选择一个称号') + '"') +
      '>删除</button>' +
      '<button type="button" class="btn primary" id="btn-save" data-crud-operation="update"' +
      ((!hasSelection || state.saveState === 'saving') ? ' disabled' : '') +
      '>保存</button>';
    var btnDelete = actions.querySelector('#btn-delete');
    btnDelete.addEventListener('click', onDeleteClick);
    var btnSave = actions.querySelector('#btn-save');
    btnSave.addEventListener('click', function () { doSave(); });

    header.appendChild(titleBlock); header.appendChild(actions);
    elDetailPane.appendChild(header);

    var body = document.createElement('div'); body.className = 'detail-body';
    if (!hasSelection) {
      var hint = document.createElement('div');
      hint.className = 'no-selection-hint';
      hint.textContent = state.listStatus === 'error'
        ? '列表加载失败，请先在左侧重试加载；加载成功后请选择或新建一个称号'
        : '请选择或新建一个称号';
      body.appendChild(hint);
    }
    var form = document.createElement('form');
    form.setAttribute('data-editor-form', ''); form.setAttribute('data-resource-id', 'title'); form.setAttribute('novalidate', 'novalidate');
    form.addEventListener('submit', function (ev) { ev.preventDefault(); doSave(); });
    form.appendChild(buildIdField());
    form.appendChild(buildNameField(hasSelection));
    form.appendChild(buildDescriptionField(hasSelection));
    body.appendChild(form);
    elDetailPane.appendChild(body);

    form.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === 's' || ev.key === 'S')) { ev.preventDefault(); doSave(); }
    });

    updateStatusLineText(statusLine);
  }

  function updateStatusLineText(el) {
    if (state.saveState === 'saving') { el.innerHTML = '保存中…'; return; }
    if (state.saveState === 'error') { el.innerHTML = '<span style="color:#ffb3b3">保存失败：' + escapeHtml(state.saveErrorMessage) + '</span>'; return; }
    if (state.dirty) { el.innerHTML = '<span class="dirty-flag">● 有未保存的修改</span>'; return; }
    if (!state.selectedId) { el.innerHTML = ''; return; }
    el.innerHTML = '<span class="saved-flag">已保存</span>';
  }

  function buildIdField() {
    var wrap = document.createElement('div'); wrap.className = 'field';
    var label = document.createElement('label'); label.setAttribute('for', 'field-id'); label.textContent = '称号ID';
    var input = document.createElement('input'); input.type = 'text'; input.id = 'field-id'; input.name = 'id';
    input.readOnly = true; input.value = state.form.id; input.setAttribute('data-field-path', 'id');
    var help = document.createElement('div'); help.className = 'help'; help.textContent = '系统自动生成的唯一标识，不可编辑';
    wrap.appendChild(label); wrap.appendChild(input); wrap.appendChild(help);
    return wrap;
  }

  function buildNameField(enabled) {
    var wrap = document.createElement('div'); wrap.className = 'field' + (state.nameError ? ' has-error' : '');
    var label = document.createElement('label'); label.setAttribute('for', 'field-name'); label.textContent = '称号名 *';
    var input = document.createElement('input'); input.type = 'text'; input.id = 'field-name'; input.name = 'name';
    input.value = state.form.name; input.setAttribute('aria-required', 'true'); input.setAttribute('data-field-path', 'name');
    input.disabled = !enabled;
    if (state.nameError) input.setAttribute('aria-describedby', 'field-name-error');
    input.addEventListener('input', function (ev) {
      state.form.name = ev.target.value; state.nameError = ''; state.dirty = computeDirty();
      var errEl = document.getElementById('field-name-error'); if (errEl) errEl.textContent = '';
      var f = document.querySelector('.field.has-error'); if (f) f.classList.remove('has-error');
      updateHeaderTexts();
    });
    var help = document.createElement('div'); help.className = 'help'; help.textContent = '必填，全项目内唯一';
    var err = document.createElement('div'); err.className = 'field-error'; err.id = 'field-name-error'; err.textContent = state.nameError;
    wrap.appendChild(label); wrap.appendChild(input); wrap.appendChild(help); wrap.appendChild(err);
    return wrap;
  }

  function buildDescriptionField(enabled) {
    var wrap = document.createElement('div'); wrap.className = 'field';
    var label = document.createElement('label'); label.setAttribute('for', 'field-description'); label.textContent = '称号描述';
    var textarea = document.createElement('textarea'); textarea.id = 'field-description'; textarea.name = 'description';
    textarea.value = state.form.description; textarea.disabled = !enabled; textarea.setAttribute('data-field-path', 'description');
    textarea.addEventListener('input', function (ev) { state.form.description = ev.target.value; state.dirty = computeDirty(); updateHeaderTexts(); });
    var help = document.createElement('div'); help.className = 'help'; help.textContent = '可选，说明称号的获取方式或效果描述';
    wrap.appendChild(label); wrap.appendChild(textarea); wrap.appendChild(help);
    return wrap;
  }

  function updateHeaderTexts() {
    var h2 = document.getElementById('detail-heading');
    if (h2 && state.selectedId) h2.textContent = state.form.name ? state.form.name : '（未命名）';
    var statusLine = document.getElementById('detail-status-line');
    if (statusLine) updateStatusLineText(statusLine);
    renderList();
  }

  function requestSelect(id) { if (state.selectedId === id) return; guardDirty(function () { doSelect(id); }); }
  function guardDirty(action) {
    if (state.dirty) { state.pendingAction = action; showDirtyGuardModal(); return; }
    action();
  }
  function doSelect(id) {
    var found = state.items.find(function (it) { return it.id === id; });
    if (!found) return;
    state.selectedId = id; state.revision = found.revision || null;
    state.form = { id: found.id, name: found.name || '', description: found.description || '' };
    state.originalSnapshot = cloneForm(state.form);
    state.dirty = false; state.nameError = ''; state.saveState = 'idle'; state.saveErrorMessage = '';
    renderAll();
  }

  function validateName() {
    var name = state.form.name.trim();
    if (!name) { state.nameError = '称号名不能为空'; return false; }
    var dup = state.items.some(function (it) { return it.id !== state.form.id && (it.name || '').trim() === name; });
    if (dup) { state.nameError = '已存在同名称号，请使用其他名称'; return false; }
    state.nameError = ''; return true;
  }

  function doSave() {
    if (!state.selectedId) return;
    if (!validateName()) {
      renderDetail();
      var input = document.getElementById('field-name'); if (input) input.focus();
      return;
    }
    state.saveState = 'saving'; renderDetail();
    var record = { id: state.form.id, name: state.form.name.trim(), description: state.form.description || '' };

    listTitles().then(function (latestItems) {
      var latestItem = latestItems.find(function (it) { return it.id === record.id; });
      var conflict = latestItem && state.originalSnapshot && (
        (latestItem.name || '') !== state.originalSnapshot.name ||
        (latestItem.description || '') !== state.originalSnapshot.description
      );
      if (conflict) {
        state.items = latestItems; state.saveState = 'idle';
        showConflictModal(latestItem);
        renderDetail();
        return;
      }
      state.items = latestItems;
      return updateTitle(record, latestItem && latestItem.revision || state.revision).then(function (saved) {
        var normalized = Object.assign({}, record, saved || {});
        state.items = state.items.map(function (it) { return it.id === normalized.id ? normalized : it; });
        onSaveSuccess(normalized);
      });
    }).catch(function (err) {
      if (err && err.status === 409) {
        state.saveState = 'idle';
        showBanner('error', '保存冲突：该称号已在服务端被更新，请刷新后重试。');
        showConflictModal(record, err);
      } else {
        onSaveError(err);
      }
    });
  }

  function onSaveSuccess(normalized) {
    state.selectedId = normalized.id; state.revision = normalized.revision || state.revision;
    state.form = { id: normalized.id, name: normalized.name || '', description: normalized.description || '' };
    state.originalSnapshot = cloneForm(state.form);
    state.dirty = false; state.saveState = 'saved'; state.saveErrorMessage = '';
    showBanner('info', '保存成功');
    renderAll();
  }
  function onSaveError(err) {
    state.saveState = 'error'; state.saveErrorMessage = (err && err.message) || '未知错误';
    renderDetail();
  }

  var deleteInProgress = false;
  var DELETE_APPROVAL_TIMEOUT_MS = 30000;

  function makeDeleteApprovalRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      var values = new Uint32Array(4);
      window.crypto.getRandomValues(values);
      return 'delete-' + Array.prototype.map.call(values, function (value) { return value.toString(16); }).join('-');
    }
    return 'delete-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  }

  function requestDeleteApproval(target) {
    return new Promise(function (resolve, reject) {
      var requestId = makeDeleteApprovalRequestId();
      var settled = false;
      var timeoutId = window.setTimeout(function () {
        finish(new Error('删除审批超时，请重新确认。'));
      }, DELETE_APPROVAL_TIMEOUT_MS);

      function finish(error, token) {
        if (settled) return;
        settled = true;
        window.clearTimeout(timeoutId);
        window.removeEventListener('message', onApprovalResult);
        if (error) reject(error);
        else resolve(token);
      }

      function onApprovalResult(event) {
        var data = event.data;
        if (event.source !== window.parent || !data || data.type !== 'aigame-plugin-delete-approval-result' || data.requestId !== requestId) return;
        if (data.ok === true && typeof data.token === 'string' && data.token) {
          finish(null, data.token);
          return;
        }
        finish(new Error(data.error || '删除审批未获通过。'));
      }

      window.addEventListener('message', onApprovalResult);
      try {
        window.parent.postMessage({
          type: 'aigame-plugin-delete-approval-request',
          requestId: requestId,
          pluginId: 'project.title',
          actionName: 'project.title.delete_title',
          input: { id: target.id, revision: target.revision }
        }, '*');
      } catch (err) {
        finish(new Error('无法请求删除审批。'));
      }
    });
  }

  function reloadCurrentTitle(id) {
    return listTitles().then(function (items) {
      state.items = items;
      state.listStatus = 'loaded';
      var latest = items.find(function (item) { return item.id === id; });
      if (latest) {
        state.selectedId = latest.id;
        state.revision = latest.revision || null;
        state.form = { id: latest.id, name: latest.name || '', description: latest.description || '' };
        state.originalSnapshot = cloneForm(state.form);
      } else {
        state.selectedId = null; state.revision = null;
        state.form = { id: '', name: '', description: '' };
        state.originalSnapshot = null;
      }
      state.dirty = false;
      state.nameError = '';
      state.saveState = 'idle';
    });
  }

  function deleteFailureMessage(err) {
    if (err && err.status === 409) return '删除冲突：记录已变化，已重新加载当前记录。';
    return '删除失败：' + ((err && err.message) || '未知错误') + ' 已重新加载当前记录。';
  }

  function requestApprovedDelete(target) {
    if (deleteInProgress) return;
    deleteInProgress = true;
    renderDetail();
    showBanner('info', '正在等待删除审批…');

    requestDeleteApproval(target).then(function (interactiveApproval) {
      // 令牌是此回调的局部值；deleteTitle 只在本次请求头中使用它。
      return deleteTitle(target.id, target.revision, interactiveApproval);
    }).then(function () {
      deleteInProgress = false;
      state.items = state.items.filter(function (it) { return it.id !== target.id; });
      state.selectedId = null; state.revision = null;
      state.form = { id: '', name: '', description: '' };
      state.originalSnapshot = null; state.dirty = false; state.nameError = ''; state.saveState = 'idle';
      showBanner('info', '删除成功');
      loadList();
    }).catch(function (err) {
      deleteInProgress = false;
      var message = deleteFailureMessage(err);
      reloadCurrentTitle(target.id).then(function () {
        renderAll();
        showBanner('error', message);
      }).catch(function () {
        renderAll();
        showBanner('error', message + ' 重新加载失败，请手动刷新列表。');
      });
    });
  }

  function openDeleteConfirmation(target) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'delete-confirmation-modal';
    overlay.innerHTML =
      '<div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="delete-confirmation-title" aria-describedby="delete-confirmation-description">' +
      '<h3 id="delete-confirmation-title">确认删除称号</h3>' +
      '<p id="delete-confirmation-description">确定删除称号「' + escapeHtml(target.label) + '」？此操作不可恢复。</p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn" data-delete-confirm-action="cancel">取消</button>' +
      '<button type="button" class="btn danger" data-delete-confirm-action="confirm">确认删除</button>' +
      '</div></div>';
    elModalRoot.appendChild(overlay);

    var cancelButton = overlay.querySelector('[data-delete-confirm-action="cancel"]');
    var confirmButton = overlay.querySelector('[data-delete-confirm-action="confirm"]');
    function close() {
      closeModal(overlay);
      var deleteButton = document.getElementById('btn-delete');
      if (deleteButton) deleteButton.focus();
    }
    cancelButton.addEventListener('click', close);
    confirmButton.addEventListener('click', function () {
      if (confirmButton.disabled) return;
      confirmButton.disabled = true;
      close();
      requestApprovedDelete(target);
    });
    overlay.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); close(); return; }
      if (ev.key === 'Tab') {
        var focusables = [cancelButton, confirmButton].filter(function (button) { return !button.disabled; });
        if (ev.shiftKey && document.activeElement === focusables[0]) { ev.preventDefault(); focusables[focusables.length - 1].focus(); }
        else if (!ev.shiftKey && document.activeElement === focusables[focusables.length - 1]) { ev.preventDefault(); focusables[0].focus(); }
      }
    });
    cancelButton.focus();
  }

  function onDeleteClick() {
    if (!state.selectedId || deleteInProgress) return;
    if (typeof state.revision !== 'string' || !state.revision) {
      showBanner('error', '无法确认当前称号版本，正在重新加载记录。');
      reloadCurrentTitle(state.selectedId).then(renderAll).catch(function () { renderAll(); });
      return;
    }
    var target = { id: state.form.id, label: state.form.name || state.form.id, revision: state.revision };
    openDeleteConfirmation(target);
  }

  // ---------- 新建称号模态窗口 ----------
  // 打开弹窗不修改右侧表单内容，无需脏数据确认；脏数据保护保留在手动切换列表项与离开页面场景。
  function openCreateModal() {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'create-modal';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'create-modal-title');
    overlay.innerHTML =
      '<div class="modal-box">' +
      '<h3 id="create-modal-title">新建称号</h3>' +
      '<div class="field">' +
      '<label for="create-modal-name">称号名</label>' +
      '<input type="text" id="create-modal-name" aria-required="true" aria-describedby="create-modal-name-help create-modal-name-error" />' +
      '<div class="help" id="create-modal-name-help">必填，全项目内唯一；创建后可在右侧详情中补充描述</div>' +
      '<div class="field-error" id="create-modal-name-error" role="alert"></div>' +
      '</div>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn" data-modal-action="cancel">取消</button>' +
      '<button type="button" class="btn primary" data-modal-action="confirm">创建</button>' +
      '</div></div>';
    elModalRoot.appendChild(overlay);

    var nameInput = document.getElementById('create-modal-name');
    var errorEl = document.getElementById('create-modal-name-error');

    function setError(text) { errorEl.textContent = text || ''; }
    function close() { closeModal(overlay); var btnNew = document.getElementById('btn-new'); if (btnNew) btnNew.focus(); }
    function validateModalName() {
      var name = (nameInput.value || '').trim();
      if (!name) { setError('称号名不能为空'); return null; }
      var dup = state.items.some(function (it) { return (it.name || '').trim().toLowerCase() === name.toLowerCase(); });
      if (dup) { setError('称号名与已有称号重复，请更换'); return null; }
      setError('');
      return name;
    }
    function confirmCreate() {
      var name = validateModalName();
      if (!name) { nameInput.focus(); return; }
      var record = { id: genTitleId(), name: name, description: '' };
      createTitle(record).then(function () {
        closeModal(overlay);
        showBanner('info', '创建成功');
        return listTitles();
      }).then(function (items) {
        if (!items) return;
        state.items = items;
        var created = null;
        for (var i = 0; i < items.length; i += 1) { if (items[i].id === record.id) { created = items[i]; break; } }
        if (created) {
          doSelect(created.id);
        } else {
          renderAll();
        }
      }).catch(function (err) {
        var message = '创建失败：' + ((err && err.message) || '未知错误');
        if (overlay.parentNode) setError(message);
        else showBanner('error', message);
      });
    }

    overlay.querySelector('[data-modal-action="cancel"]').addEventListener('click', close);
    overlay.querySelector('[data-modal-action="confirm"]').addEventListener('click', confirmCreate);
    nameInput.addEventListener('input', function () { setError(''); });
    overlay.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); close(); return; }
      if (ev.key === 'Enter' && ev.target === nameInput) { ev.preventDefault(); confirmCreate(); return; }
      if (ev.key === 'Tab') {
        var focusables = Array.prototype.slice.call(overlay.querySelectorAll('input, button')).filter(function (el) { return !el.disabled; });
        if (focusables.length === 0) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (ev.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
          ev.preventDefault(); last.focus();
        } else if (!ev.shiftKey && document.activeElement === last) {
          ev.preventDefault(); first.focus();
        }
      }
    });
    nameInput.focus();
  }

  function showDirtyGuardModal() {
    var overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dirty-guard-title">' +
      '<h3 id="dirty-guard-title">有未保存的修改</h3>' +
      '<p>当前称号存在未保存的修改，切换或离开将丢失这些修改。是否放弃修改并继续？</p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn" id="dirty-guard-cancel">取消，继续编辑</button>' +
      '<button type="button" class="btn danger" id="dirty-guard-discard">放弃修改并继续</button>' +
      '</div></div>';
    elModalRoot.appendChild(overlay);
    document.getElementById('dirty-guard-cancel').addEventListener('click', function () { state.pendingAction = null; closeModal(overlay); });
    document.getElementById('dirty-guard-discard').addEventListener('click', function () {
      var action = state.pendingAction; state.pendingAction = null; state.dirty = false;
      closeModal(overlay); if (action) action();
    });
    document.getElementById('dirty-guard-discard').focus();
  }

  function showConflictModal(latestItem, err) {
    var targetId = latestItem && latestItem.id;
    var overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="conflict-title">' +
      '<h3 id="conflict-title">保存冲突</h3>' +
      '<p>该称号的数据已在服务端被更新。请放弃本地修改并重新加载最新数据后重试，或覆盖保存。</p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn" id="conflict-reload" data-conflict-action="reload">放弃并重新加载</button>' +
      '<button type="button" class="btn primary" id="conflict-overwrite">覆盖保存</button>' +
      '</div></div>';
    elModalRoot.appendChild(overlay);
    document.getElementById('conflict-reload').addEventListener('click', function () {
      closeModal(overlay);
      state.saveState = 'idle'; state.dirty = false;
      renderDetail();
      listTitles().then(function (items) {
        state.items = items;
        var found = items.find(function (it) { return it.id === targetId; });
        if (found) {
          state.selectedId = found.id; state.revision = found.revision || null;
          state.form = { id: found.id, name: found.name || '', description: found.description || '' };
          state.originalSnapshot = cloneForm(state.form);
        }
        renderAll();
        showBanner('info', '已重新加载最新数据，请重新编辑后保存。');
      }).catch(function (e) { showBanner('error', '重新加载失败：' + ((e && e.message) || '未知错误')); });
    });
    document.getElementById('conflict-overwrite').addEventListener('click', function () {
      closeModal(overlay);
      state.originalSnapshot = { id: latestItem.id, name: latestItem.name || '', description: latestItem.description || '' };
      state.revision = latestItem.revision || state.revision;
      doSave();
    });
  }
  function closeModal(overlay) { if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); }

  function renderAll() { renderList(); renderDetail(); }

  function loadList() {
    state.listStatus = 'loading'; renderAll();
    listTitles().then(function (items) {
      state.items = items; state.listStatus = 'loaded'; renderAll();
    }).catch(function (err) {
      state.listStatus = 'error'; state.listErrorMessage = (err && err.message) || '加载失败'; renderAll();
    });
  }

  document.getElementById('btn-new').addEventListener('click', openCreateModal);
  document.getElementById('btn-refresh').addEventListener('click', loadList);
  document.getElementById('btn-list-retry').addEventListener('click', loadList);
  elSearch.addEventListener('input', function (ev) { state.searchTerm = ev.target.value; renderList(); });
  window.addEventListener('beforeunload', function (ev) { if (state.dirty) { ev.preventDefault(); ev.returnValue = ''; } });

  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'aigame-auth-token' || !event.data.token) return;
    authToken = event.data.token;
    if (!authReady) { authReady = true; loadList(); }
  });
  window.parent.postMessage({ type: 'aigame-auth-token-request' }, '*');

  renderAll();
}());
</script>
</body>
