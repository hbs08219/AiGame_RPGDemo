<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>称号系统</title><style>body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101522;color:#eef3ff}main{max-width:860px;margin:32px auto;padding:24px;border:1px solid #283753;border-radius:12px;background:#151c2c}form{display:grid;gap:12px}label{display:grid;gap:5px;color:#b9c7de}input{padding:9px;border:1px solid #40506d;border-radius:6px;background:#0d1320;color:#fff}.actions{display:flex;gap:8px;margin:14px 0}button{padding:8px 14px}pre{white-space:pre-wrap;background:#0d1320;padding:12px;border-radius:8px}</style></head><body><main><h1>称号系统</h1><form id="editor-form"><label>id<input name="id" required></label><label>name<input name="name" required></label><label>description<input name="description" required></label></form><div class="actions"><button type="button" data-crud-operation="read">刷新</button><button type="button" data-crud-operation="create">新建</button><button type="button" data-crud-operation="update">保存修改</button><button type="button" data-crud-operation="delete">删除</button></div><pre id="output">等待操作</pre></main>
<script id="agmaker-editor-contract" type="application/json">{"version":1,"dataAccess":{"mechanism":"plugin-action-api","capabilities":["toolgen.read","toolgen.write"],"available":true},"crud":{"read":{"available":true,"method":"POST","actionName":"project.title.list_titles","path":"/plugin-tool/project.title/project.title.list_titles"},"create":{"available":true,"method":"POST","actionName":"project.title.create_title","path":"/plugin-tool/project.title/project.title.create_title"},"update":{"available":true,"method":"POST","actionName":"project.title.update_title","path":"/plugin-tool/project.title/project.title.update_title"},"delete":{"available":true,"method":"POST","actionName":"project.title.delete_title","path":"/plugin-tool/project.title/project.title.delete_title"}}}</script>
<script>
const form=document.getElementById('editor-form'),output=document.getElementById('output');let selectedRevision='';
function readResponse(response){return response.json().then(payload=>{if(!response.ok||payload.error)throw new Error(payload.error||('HTTP '+response.status));return payload.data||payload;});}
function documentValue(){return Object.fromEntries(["id","name","description"].map(name=>[name,form.elements[name].value]));}
function listRecords(){return fetch("/plugin-tool/project.title/project.title.list_titles", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: '', limit: 200 }) }).then(readResponse);}
function createRecord(){return fetch("/plugin-tool/project.title/project.title.create_title", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ document: documentValue() }) }).then(readResponse);}
function updateRecord(){const document=documentValue(),id=document["id"],patch={...document};delete patch["id"];return fetch("/plugin-tool/project.title/project.title.update_title", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, patch, ...(selectedRevision ? { revision: selectedRevision } : {}) }) }).then(readResponse);}
function deleteRecord(){const id=documentValue()["id"];return fetch("/plugin-tool/project.title/project.title.delete_title", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, ...(selectedRevision ? { revision: selectedRevision } : {}) }) }).then(readResponse);}
for(const button of document.querySelectorAll('[data-crud-operation]'))button.addEventListener('click',async()=>{try{const operation=button.dataset.crudOperation;const data=await({read:listRecords,create:createRecord,update:updateRecord,delete:deleteRecord}[operation])();selectedRevision=data.result?.revision||selectedRevision;output.textContent=JSON.stringify(data.result||data,void 0,2);}catch(error){output.textContent=error.message;}});
</script></body></html>
