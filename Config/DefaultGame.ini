[/Script/UnrealEd.ProjectPackagingSettings]
; AiGame 自动资产落地：只有已被编辑器引用并同步到 Published 的资产参与 cook。
; Cache 是可重新激活的编辑期缓存，明确不加入任何 cook 根。
+DirectoriesToAlwaysCook=(Path="/Game/AiGame/Published")
; 角色 Plane 使用的遮罩精灵材质由 C++ 在运行时按路径加载，属于软引用，必须显式加入 Cook 根。
+DirectoriesToAlwaysCook=(Path="/Game/AiGame/Runtime/Materials")
; ToolGen 和 PuerTS 从 ProjectContentDir 以文件形式读取 JSON / JavaScript；它们不是 uasset，必须作为 UFS 显式随发布包 Stage。
+DirectoriesToAlwaysStageAsUFS=(Path="Data/ToolGen")
+DirectoriesToAlwaysStageAsUFS=(Path="JavaScript")

